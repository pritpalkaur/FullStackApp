<h2>Product List</h2>
<!-- ✅ Create Product Form -->
<div class="form-container">
<mat-form-field appearance="outline">
  <mat-label>Name</mat-label>
  <input matInput [(ngModel)]="newProduct.name" />
</mat-form-field>

<mat-form-field appearance="outline">
  <mat-label>Price</mat-label>
  <input matInput type="number" [(ngModel)]="newProduct.price" />
</mat-form-field>

<mat-form-field appearance="outline">
  <mat-label>Stock</mat-label>
  <input matInput type="number" [(ngModel)]="newProduct.stock" />
</mat-form-field>

<input type="file" (change)="onFileSelected($event)" />

<button mat-raised-button color="primary" (click)="createProduct()">Create</button>
</div>

<table mat-table [dataSource]="products" class="mat-elevation-z8">
    <ng-container matColumnDef="image">
  <th mat-header-cell *matHeaderCellDef> Image </th>
  <td mat-cell *matCellDef="let product">
    <img [src]="product.imageUrl" alt="{{product.name}}" width="60" />
  </td>
</ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef> Name </th>
    <td mat-cell *matCellDef="let product"> {{ product.name }} </td>
  </ng-container>

  <!-- Price Column -->
  <ng-container matColumnDef="price">
    <th mat-header-cell *matHeaderCellDef> Price </th>
    <td mat-cell *matCellDef="let product"> {{ product.price }} </td>
  </ng-container>

  <!-- Stock Column -->
  <ng-container matColumnDef="stock">
    <th mat-header-cell *matHeaderCellDef> Stock </th>
    <td mat-cell *matCellDef="let product"> {{ product.stock }} </td>
  </ng-container>

  <!-- Actions Column -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef> Actions </th>
    <td mat-cell *matCellDef="let product">
      <button mat-button (click)="editProduct(product)">Edit</button>
      <button mat-button (click)="deleteProduct(product)">Delete</button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
